<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
     <script src="script.js" defer></script>
</head>
<body onload="startTime()">
    <div class="navigation">
       
        <div id="expenses">
        <a href="home.html">Expense Tracker</a>
       </div> 

       <div id="others">
        <a href="home.html" class="ancor">Home</a>
        <a href="Add.html" class="ancor">Add</a>
        <a href="expenses.html" class="ancor">Expenses</a>
        <a href="Currency.html" class="ancor" style="background-color:rgb(102, 122, 236);">Currency</a>
        </div>

        <div id="clock"></div>
    
    </div>

    <div id="currencyPage">
        <h2>Convert your total</h2>
        <p>
            The exchange rate comes from a third-party API: https://open.er <br>
            -api.com/v6/latest/ALL. Open DevTools, Network tab, and watch the request <br>
            when you press Convert.
        </p>

        <h5>Amount in Lek</h5>
        <input type="number">
        <h5>Currency</h5>
        <select name="Currency" id="">
            
            <option value="EUR">EUR</option>
            <option value="USD">UDS</option>
            <option value="GPB">GPB</option>
            <option value="CHF">CHF</option>
            <option value="TRY">TRY</option>
            <option value="MKD">MKD</option>
        </select>
        <button>Convert</button>

        <h1 id="converted"></h1>
    </div>
</body>     
</html>
